services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: istudio
      POSTGRES_USER: istudio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-istudio_dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - istudio_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U istudio -d istudio"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-56379}:6379"
    volumes:
      - istudio_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 4000
      DATABASE_URL: postgresql://istudio:${POSTGRES_PASSWORD:-istudio_dev}@postgres:5432/istudio?sslmode=disable
      REDIS_URL: redis://redis:6379
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-istudio-docker-secret-change-me}
      WEB_ORIGINS: http://127.0.0.1:3000,http://localhost:3000
      AI_PROVIDER_ENABLED: ${AI_PROVIDER_ENABLED:-true}
      BANANA_ROUTER_BASE_URL: ${BANANA_ROUTER_BASE_URL:-https://api.bananarouter.com}
      BANANA_ROUTER_API_KEY: ${BANANA_ROUTER_API_KEY:-}
      BANANA_ROUTER_TIMEOUT_SECONDS: ${BANANA_ROUTER_TIMEOUT_SECONDS:-300}
      STORAGE_ROOT: /data/uploads
    ports:
      - "127.0.0.1:${API_PORT:-4000}:4000"
    volumes:
      - istudio_uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://127.0.0.1:4000}
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://127.0.0.1:4000}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  istudio_postgres_data:
  istudio_redis_data:
  istudio_uploads:
