<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>图片反推提示词 · 设计预览</title>
<style>
:root{color-scheme:light;--ink:#17191c;--muted:#707887;--line:#e5e7eb;--soft:#f5f6f8;--surface:#fff}
*{box-sizing:border-box}body{margin:0;background:#eef0f3;color:var(--ink);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}button,input,textarea,select{font:inherit}button,a,summary{cursor:pointer}button:disabled{cursor:default;opacity:.55}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--ink);outline-offset:3px}button{min-height:44px;border:1px solid var(--line);border-radius:8px;padding:0 14px;background:var(--surface);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:8px}button:hover{background:var(--soft)}.primary{background:var(--ink);border-color:var(--ink);color:#fff}.primary:hover{background:#333}.icon-button{width:44px;padding:0}.page{max-width:1136px;margin:auto;padding:30px 24px}.preview-bar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:0 0 18px;font-size:13px;color:var(--muted)}.preview-label{display:flex;align-items:center;gap:9px}.dot{width:6px;height:6px;border-radius:50%;background:#20242b}.sheet{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 16px 60px #17223512;overflow:hidden}.head{padding:24px 28px;display:flex;align-items:flex-start;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line)}h1{font-size:21px;line-height:1.4;letter-spacing:-.4px;margin:0 0 5px;font-weight:600}.head p{margin:0;color:var(--muted);font-size:13px}.body{display:grid;grid-template-columns:360px minmax(0,1fr)}.source{padding:24px;border-right:1px solid var(--line);background:#fcfcfd}.result{padding:24px 28px;min-width:0}.label-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.eyebrow{font-size:13px;font-weight:550}.subtle{color:var(--muted);font-size:12px}.image-frame{position:relative;height:276px;background:#f3eee6;border:1px solid #e6ded2;border-radius:10px;display:grid;place-items:center;overflow:hidden}.image-frame svg{width:100%;height:100%}.image-frame img{width:100%;height:100%;object-fit:contain}.image-note{position:absolute;left:12px;bottom:10px;font-size:11px;color:#6c6255;background:#f7f1e6dc;padding:2px 6px;border-radius:4px}.image-actions{display:flex;align-items:center;justify-content:space-between;margin:10px 0 24px;gap:8px}.image-actions button{font-size:12px;min-height:36px;padding:0 10px;border:0;color:#626b79}.field-label{display:block;font-size:13px;font-weight:550;margin-bottom:8px}.segments{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border:1px solid var(--line);background:var(--soft);border-radius:9px}.segments button{font-size:13px;min-height:40px;border:0;background:transparent;padding:0 8px}.segments button[aria-pressed=true]{background:#fff;box-shadow:0 1px 4px #00000010}.mode-help{margin:8px 0 18px;font-size:12px;line-height:1.7;color:var(--muted)}.requirements{width:100%;min-height:78px;resize:vertical;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font-size:13px}.analyze{width:100%;margin-top:16px}.provider{display:flex;align-items:center;justify-content:center;gap:6px;margin:10px 0 0;color:var(--muted);font-size:11px}.result-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.result-title{display:flex;align-items:center;gap:8px;font-weight:550}.result-state{font-size:11px;background:var(--soft);padding:3px 7px;color:var(--muted);border-radius:4px;font-weight:400}.language{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}select{min-height:36px;padding:0 26px 0 10px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink)}.prompt{display:block;width:100%;height:228px;resize:vertical;padding:16px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:14px;line-height:1.9;color:var(--ink)}.result-meta{display:flex;justify-content:space-between;align-items:center;margin:10px 0 23px;color:var(--muted);font-size:12px;gap:12px}.text-button{min-height:32px;padding:0 5px;border:0;background:transparent;color:var(--muted);font-size:12px}.analysis{border-top:1px solid var(--line);padding-top:15px}.analysis summary{display:flex;align-items:center;justify-content:space-between;list-style:none;font-weight:550;font-size:13px;min-height:32px}.analysis summary::-webkit-details-marker{display:none}.analysis summary:after{content:'＋';color:var(--muted);font-size:18px}.analysis[open] summary:after{content:'−'}.analysis dl{display:grid;grid-template-columns:50px minmax(0,1fr);gap:9px 16px;margin:15px 0 0;font-size:12px}.analysis dt{color:var(--muted)}.analysis dd{margin:0;line-height:1.8}.hint{margin:18px 0 0;font-size:12px;color:var(--muted);line-height:1.7}.foot{padding:18px 24px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:18px}.reference{display:flex;align-items:center;gap:7px;font-size:12px;color:#626b79}.reference input{width:16px;height:16px;accent-color:var(--ink)}.commands{display:flex;gap:8px;flex-wrap:wrap}.commands button{font-size:13px}.toast{min-height:26px;margin:15px 0 0;font-size:13px;text-align:center;color:#566173}.sr-only{position:absolute;width:1px;height:1px;clip:rect(0,0,0,0);overflow:hidden;white-space:nowrap}dialog{max-width:420px;width:calc(100% - 32px);border:1px solid var(--line);border-radius:14px;padding:24px;color:var(--ink)}dialog::backdrop{background:#17191c45}dialog h2{font-size:18px;margin:0 0 20px}dialog label{display:grid;gap:7px;margin-top:14px;font-size:13px}dialog input,dialog select{width:100%;min-height:44px;border:1px solid var(--line);border-radius:7px;background:#fff;padding:8px 10px}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:24px}.dialog-note{color:var(--muted);font-size:12px;margin:16px 0 0}#reopen{display:none}.spinner{display:none;width:15px;height:15px;border:2px solid #ffffff66;border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}.busy .spinner{display:block}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.spinner{animation:none}}
@media(max-width:760px){.page{padding:16px 12px}.preview-bar{font-size:12px}.preview-bar>span{display:none}.head{padding:20px}.body{grid-template-columns:minmax(0,1fr)}.source{border-right:0;border-bottom:1px solid var(--line);padding:20px}.image-frame{height:230px}.result{padding:20px}.prompt{height:230px}.foot{padding:16px 20px;align-items:flex-start;flex-direction:column;gap:12px}.commands{width:100%;display:grid;grid-template-columns:auto auto minmax(0,1fr)}.commands button{padding:0 9px;font-size:12px}.result-toolbar{gap:8px}.result-state{display:none}.result-meta{align-items:flex-start}.provider{font-size:11px}.preview-label{flex-wrap:wrap}.analysis dl{gap:9px 12px}}
.image-frame{height:240px}.image-actions{margin-bottom:16px}.mode-help{margin-bottom:12px}.extra summary{display:flex;align-items:center;justify-content:space-between;min-height:32px;font-size:13px;font-weight:550;list-style:none}.extra summary::-webkit-details-marker{display:none}.extra summary:after{content:'＋';font-size:17px;color:var(--muted)}.extra[open] summary:after{content:'−'}.extra .requirements{margin-top:8px}.extra summary span{margin-left:8px;margin-right:auto;color:var(--muted);font-size:12px;font-weight:400}
</style>
</head>
<body>
<div class="page">
  <div class="preview-bar"><div class="preview-label"><span class="dot"></span>iStudio · 图片反推提示词 <span class="subtle">设计预览 / 示例结果</span></div><span>上传 → 分析 → 编辑 → 创作</span></div>
  <button id="reopen">重新打开设计预览</button>
  <main class="sheet" id="sheet">
    <header class="head"><div><h1>图片反推提示词</h1><p>把参考画面变成可编辑的创作描述</p></div><button class="icon-button" id="close" aria-label="关闭预览"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></header>
    <div class="body">
      <section class="source" aria-label="参考图片与分析设置">
        <div class="label-row"><span class="eyebrow">参考图片</span><span class="subtle">单张图片</span></div>
        <div class="image-frame" id="image-frame">
          <svg viewBox="0 0 312 276" role="img" aria-label="用于展示布局的琥珀色瓶子示意图">
            <defs><linearGradient id="wall" x2="0" y2="1"><stop stop-color="#ebe3d5"/><stop offset="1" stop-color="#f8f3e9"/></linearGradient><linearGradient id="glass"><stop stop-color="#4d2c10"/><stop offset=".24" stop-color="#865b2a"/><stop offset=".43" stop-color="#dba864"/><stop offset=".63" stop-color="#895b2a"/><stop offset="1" stop-color="#4a2c12"/></linearGradient><linearGradient id="cap"><stop stop-color="#161714"/><stop offset=".5" stop-color="#393b34"/><stop offset="1" stop-color="#161714"/></linearGradient><filter id="blur"><feGaussianBlur stdDeviation="7"/></filter></defs>
            <rect width="312" height="276" fill="url(#wall)"/><path d="M0 66 145 0H180L0 93ZM0 156 267 0H304L0 185Z" fill="#fff" opacity=".35"/><path d="m204 207 100 40-105 9-79-22Z" fill="#91816b" opacity=".18" filter="url(#blur)"/><ellipse cx="154" cy="229" rx="48" ry="8" fill="#6d5337" opacity=".18" filter="url(#blur)"/>
            <path d="M135 66h36v25c0 8 27 18 27 40v82q0 13-13 14h-63q-12-1-12-14v-82c0-22 25-32 25-40Z" fill="url(#glass)" stroke="#573713" stroke-opacity=".3"/><rect x="129" y="43" width="48" height="30" rx="5" fill="url(#cap)"/><path d="M119 127v76" stroke="#fff4d8" stroke-opacity=".5" stroke-width="4" stroke-linecap="round"/><rect x="112" y="144" width="84" height="52" rx="2" fill="#f0ebdf"/><path d="M133 160h42M128 170h50M140 183h27" stroke="#514c41" stroke-width="1" opacity=".55"/>
          </svg><span class="image-note">示意图 · 用于展示布局</span>
        </div>
        <div class="image-actions"><span class="subtle" id="filename">产品摄影参考.png</span><button id="replace">替换图片</button><input type="file" id="upload" accept="image/png,image/jpeg,image/webp" hidden></div>
        <span class="field-label">分析模式</span>
        <div class="segments" role="group" aria-label="分析模式"><button data-mode="scene" aria-pressed="true">还原画面</button><button data-mode="style" aria-pressed="false">只提取风格</button></div>
        <p class="mode-help" id="mode-help">描述图片中的主体、场景、构图与光影。</p>
        <details class="extra"><summary>补充要求 <span>选填</span></summary><label class="sr-only" for="requirements">补充分析要求</label><textarea class="requirements" id="requirements" placeholder="例如：重点描述光影，不要画面文字"></textarea></details>
        <button class="primary analyze" id="analyze"><span class="spinner" aria-hidden="true"></span><span id="analyze-label">重新分析</span></button>
        <p class="provider">识图服务：DeepSeek <span aria-hidden="true">·</span> 图片会发送至该服务</p>
      </section>
      <section class="result" aria-label="可编辑的提示词结果">
        <div class="result-toolbar"><div class="result-title">生成的提示词 <span class="result-state">示例结果</span></div><div class="language"><label for="language">语言</label><select id="language"><option value="zh">中文</option><option value="en">English</option></select></div></div>
        <label class="sr-only" for="prompt">编辑反推提示词</label><textarea id="prompt" class="prompt"></textarea>
        <div class="result-meta"><span>可直接编辑，应用前再核对一次</span><button class="text-button" id="restore">恢复分析结果</button></div>
        <details class="analysis"><summary>画面分析</summary><dl id="analysis-fields"></dl></details>
        <p class="hint">从可见画面提炼创作描述；原始提示词和生成参数无法仅凭图片准确恢复。</p>
      </section>
    </div>
    <footer class="foot"><label class="reference"><input type="checkbox" id="reference" checked>同时将原图作为生图参考</label><div class="commands"><button id="copy">复制提示词</button><button id="save">保存到灵感库</button><button class="primary" id="apply">应用到生图 <span aria-hidden="true">↗</span></button></div></footer>
  </main>
  <p class="toast" role="status" id="toast">此预览使用示例结果，可切换模式、编辑和查看保存流程。</p>
</div>
<dialog id="save-dialog" aria-labelledby="save-title"><h2 id="save-title">保存到灵感库</h2><form method="dialog"><label>标题<input value="暖光产品摄影" required></label><label>分类<select><option>摄影写实</option><option>商品电商</option><option>其他场景</option></select></label><label class="reference" style="display:flex"><input type="checkbox" style="width:16px;min-height:16px">使用原图作为灵感封面</label><p class="dialog-note">先保存为未启用草稿，确认内容后再启用。</p><div class="dialog-actions"><button value="cancel">取消</button><button class="primary" value="save">保存草稿</button></div></form></dialog>
<script>
const samples={scene:{zh:'一只琥珀色玻璃瓶置于浅米色台面上，瓶身配有黑色瓶盖和浅色标签。主体完整、略偏居中，以平视的近景产品摄影构图展示。左上方自然侧逆光透过瓶身，呈现通透的玻璃质感、克制的高光与柔和接触阴影；浅米色背景带有倾斜的窗光投影。画面保持暖色调、干净留白和安静的氛围，保留原图可见的瓶身比例，不添加额外道具或新的文字。',en:'A single amber glass bottle with a black cap and a pale label on a light beige surface. Keep the entire subject visible in a near-centered, eye-level product composition. Natural side and back light from the upper left reveals the translucent glass, restrained highlights, and a soft contact shadow. Diagonal window-light patterns cross a light beige background. Use a warm, quiet palette with clean negative space. Preserve the visible bottle proportions without adding props or new text.'},style:{zh:'采用克制的商业静物摄影语言：暖米色与深棕色调，自然侧逆光，通透材质的细腻反射，柔和接触阴影，背景带有倾斜的窗光投影。构图简洁，主体完整，近景平视，周围保留呼吸感。避免过度锐化、强烈镜面高光和复杂装饰，将以上光影、配色与质感用于新的创作主题。',en:'Use a restrained commercial still-life photography style: a warm beige and deep brown palette, natural side and back light, delicate reflections on translucent materials, soft contact shadows, and diagonal window-light patterns in the background. Keep a clean eye-level composition, a fully visible subject, and generous negative space. Avoid oversharpening, harsh specular highlights, and elaborate decoration. Apply this visual language to a new subject.'}};
const fields={scene:[['主体','琥珀色瓶身、黑色瓶盖、浅色标签'],['场景','浅米色台面与背景'],['构图','主体完整、近景平视、居中留白'],['光线','左上方自然侧逆光、倾斜窗光'],['色彩','暖米色、琥珀色、黑色'],['质感','通透玻璃感、柔和接触阴影'],['文字','标签内容不可读，不猜写品牌']],style:[['风格','克制的商业静物摄影'],['构图','主体完整、近景平视、干净留白'],['光线','自然侧逆光、柔和接触阴影'],['色彩','暖米色与深棕色调'],['质感','细腻反射、通透材质'],['排除','原图商品、品牌和文字']]};
let mode='scene';const $=id=>document.getElementById(id);function toast(text){$('toast').textContent=text}function update(){const language=$('language').value;$('prompt').value=samples[mode][language];$('analysis-fields').replaceChildren();for(const [name,value] of fields[mode]){const term=document.createElement('dt'),detail=document.createElement('dd');term.textContent=name;detail.textContent=value;$('analysis-fields').append(term,detail)}}update();
document.querySelectorAll('[data-mode]').forEach(button=>button.addEventListener('click',()=>{mode=button.dataset.mode;document.querySelectorAll('[data-mode]').forEach(other=>other.setAttribute('aria-pressed',String(other===button)));$('mode-help').textContent=mode==='scene'?'描述图片中的主体、场景、构图与光影。':'只提取视觉语言，跳过原图的商品、人物与文字。';$('reference').checked=mode==='scene';update();toast('已切换示例结果；实际产品将在分析时应用所选模式。')}));
$('language').addEventListener('change',()=>{update();toast('切换已有语言结果，无需再次调用识图服务。')});$('restore').addEventListener('click',()=>{update();toast('已恢复本次示例分析结果。')});$('analyze').addEventListener('click',()=>{const button=$('analyze');button.disabled=true;button.classList.add('busy');$('analyze-label').textContent='正在分析图片…';toast('正在演示等待状态');setTimeout(()=>{button.disabled=false;button.classList.remove('busy');$('analyze-label').textContent='重新分析';update();toast('示例分析完成。此设计预览未调用识图接口。')},900)});
$('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText($('prompt').value);toast('提示词已复制。')}catch{$('prompt').focus();$('prompt').select();toast('已选中提示词，可按 Ctrl/Cmd+C 复制。')}});$('save').addEventListener('click',()=>$('save-dialog').showModal());$('save-dialog').addEventListener('close',()=>{if($('save-dialog').returnValue==='save')toast('已展示保存草稿流程，预览不会写入灵感库。')});$('apply').addEventListener('click',()=>toast('实际产品将填入生图输入框，原有文字可选择替换或追加，并支持撤销。'));
$('replace').addEventListener('click',()=>$('upload').click());$('upload').addEventListener('change',()=>{const file=$('upload').files[0];if(!file)return;if(file.size>10*1024*1024){toast('请选择不超过 10 MB 的图片。');return}const reader=new FileReader();reader.onload=()=>{const image=document.createElement('img');image.alt='上传的参考图片';image.src=reader.result;$('image-frame').replaceChildren(image);$('filename').textContent=file.name;toast('图片仅在此预览中显示，提示词仍为示例内容。')};reader.readAsDataURL(file)});$('close').addEventListener('click',()=>{$('sheet').hidden=true;$('reopen').style.display='inline-flex';toast('草稿已保留，重新打开可继续编辑。')});$('reopen').addEventListener('click',()=>{$('sheet').hidden=false;$('reopen').style.display='none';toast('已恢复预览草稿。')});
</script>
</body>
</html>
