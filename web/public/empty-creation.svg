<svg width="420" height="280" viewBox="0 0 420 280" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">空白创作画布</title>
  <desc id="desc">三张错落叠放的黑白抽象画幅，作为尚无生成结果时的装饰插画。</desc>
  <defs>
    <filter id="paper-shadow" x="-50%" y="-35%" width="200%" height="190%" color-interpolation-filters="sRGB">
      <feDropShadow dy="9" stdDeviation="9" flood-color="#111318" flood-opacity=".07"/>
      <feDropShadow dy="1" stdDeviation="1" flood-color="#111318" flood-opacity=".04"/>
    </filter>
    <radialGradient id="sphere" cx=".31" cy=".23" r=".8">
      <stop stop-color="#71747A"/>
      <stop offset=".48" stop-color="#34363B"/>
      <stop offset="1" stop-color="#111318"/>
    </radialGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DADDE2"/>
    </linearGradient>
    <clipPath id="left-art"><rect x="44" y="80" width="100" height="125" rx="3"/></clipPath>
    <clipPath id="right-art"><rect x="277" y="81" width="100" height="125" rx="3"/></clipPath>
  </defs>
  <g transform="rotate(-12 96 145)">
    <rect x="35" y="70" width="118" height="151" rx="9" fill="#FFFFFF" filter="url(#paper-shadow)"/>
    <g clip-path="url(#left-art)">
      <rect x="44" y="80" width="100" height="125" fill="#E9EAED"/>
      <circle cx="61" cy="111" r="55" fill="#D6D9DE"/>
      <path d="M44 196L144 108V205H44V196Z" fill="#A5AAB3"/>
      <path d="M44 196L144 108L92 205H44V196Z" fill="url(#fold)"/>
    </g>
  </g>
  <g transform="rotate(11 327 145)">
    <rect x="268" y="71" width="118" height="151" rx="9" fill="#FFFFFF" filter="url(#paper-shadow)"/>
    <g clip-path="url(#right-art)">
      <rect x="277" y="81" width="100" height="125" fill="#E9EAED"/>
      <path d="M277 175L377 120V206H277V175Z" fill="#C4C8CF"/>
      <path d="M297 179V164L317 153V138L337 127V112L357 101V86L377 75V161L297 206V179Z" fill="#FAFAFB"/>
      <path d="M297 164L307 170L327 159V144L347 133V118L367 107V92L377 86V161L297 206V164Z" fill="#D5D8DE"/>
    </g>
  </g>
  <g transform="rotate(-2 210 138)">
    <rect x="128" y="34" width="164" height="205" rx="11" fill="#FFFFFF" filter="url(#paper-shadow)"/>
    <rect x="139" y="45" width="142" height="168" rx="4" fill="#F0F1F3"/>
    <ellipse cx="214" cy="186" rx="49" ry="8" fill="#E0E2E6"/>
    <circle cx="210" cy="125" r="48" fill="url(#sphere)"/>
    <ellipse cx="210" cy="133" rx="65" ry="23" transform="rotate(-38 210 133)" stroke="#D3D6DC" stroke-width="11"/>
    <path d="M161 167C168 180 195 174 223 152C251 130 269 104 261 94" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
    <circle cx="179" cy="79" r="7" fill="#FFFFFF"/>
    <rect x="190" y="224" width="40" height="3" rx="1.5" fill="#E7E9ED"/>
  </g>
</svg>
