name: Publish Docker image

on:
  workflow_dispatch:
    inputs:
      image:
        description: Docker Hub account/repository
        default: mofugn1/istudio
        required: true
        type: string
      tag:
        description: Image version tag
        default: latest
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate image destination
        env:
          IMAGE: ${{ inputs.image }}
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$IMAGE" =~ ^[a-z0-9][a-z0-9_-]+/[a-z0-9][a-z0-9_.-]+$ ]]
          [[ "$TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]*$ ]]
      - name: Set up emulation
        uses: docker/setup-qemu-action@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and publish amd64 and arm64
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/image.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ inputs.image }}:${{ inputs.tag }}
          build-args: VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
