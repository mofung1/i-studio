name: i-studio

# compose 的 ${VAR} 插值读的是宿主机 shell 环境变量，不会读 apps/server/.env。
# 显式指定 env_file，让 AI 服务配置与本地运行时同源。
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: istudio
      POSTGRES_USER: istudio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-istudio_dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - istudio_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U istudio -d istudio"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-56379}:6379"
    volumes:
      - istudio_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    # env_file 提供 AI 服务与鉴权配置；environment 只覆盖容器内专属配置，
    # 避免把 .env 中自定义的图片中转域名、超时等设置覆盖掉。
    env_file:
      - path: ../apps/server/.env
        required: false
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 4000
      DATABASE_URL: postgresql://istudio:${POSTGRES_PASSWORD:-istudio_dev}@postgres:5432/istudio?sslmode=disable
      REDIS_URL: redis://redis:6379
      WEB_ORIGINS: http://127.0.0.1:33000,http://localhost:33000
      STORAGE_ROOT: /data/uploads
    ports:
      - "127.0.0.1:${API_PORT:-44000}:4000"
    volumes:
      # 绑定挂载宿主机 uploads：灵感库案例图由 seed-inspiration 生成在宿主机，
      # 命名卷会让容器与宿主机隔离，导致 /v1/inspiration/images/* 全部 404。
      - ../apps/server/storage/uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://127.0.0.1:44000}
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://127.0.0.1:44000}
    ports:
      - "127.0.0.1:${WEB_PORT:-33000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  istudio_postgres_data:
  istudio_redis_data:
