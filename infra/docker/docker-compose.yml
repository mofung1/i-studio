services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: istudio
      POSTGRES_USER: istudio
      POSTGRES_PASSWORD: istudio_dev
    ports:
      - "5432:5432"
    volumes:
      - istudio_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U istudio -d istudio"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - istudio_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  istudio_postgres_data:
  istudio_redis_data:

